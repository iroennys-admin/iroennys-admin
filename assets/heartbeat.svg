<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80" role="img" aria-label="System heartbeat">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0420"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B2FF7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C77DFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="80" rx="14" ry="14" fill="url(#hbg)" stroke="#7B2FF7" stroke-opacity="0.35"/>

  <!-- Heartbeat line -->
  <g filter="url(#hglow)" stroke="url(#hl)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 40 L 120 40 L 140 40 L 150 22 L 165 58 L 175 30 L 185 50 L 200 40 L 360 40 L 380 40 L 390 25 L 405 55 L 415 33 L 425 47 L 440 40 L 600 40 L 620 40 L 632 26 L 646 54 L 656 32 L 666 48 L 680 40 L 800 40"
          stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" values="900;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Pulse dot following -->
  <circle r="3.5" fill="#C77DFF" filter="url(#hglow)">
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#hb-path"/>
    </animateMotion>
  </circle>
  <path id="hb-path" d="M 0 40 L 200 40 L 360 40 L 440 40 L 600 40 L 800 40" fill="none" opacity="0"/>

  <!-- Text label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="20" y="20" fill="#C77DFF" opacity="0.85">◆ SYSTEM</text>
    <text x="20" y="70" fill="#7B2FF7" opacity="0.7">alive ⊹</text>
    <text x="780" y="20" fill="#C77DFF" opacity="0.85" text-anchor="end">UPTIME ∞</text>
    <text x="780" y="70" fill="#7B2FF7" opacity="0.7" text-anchor="end">stable</text>
  </g>
</svg>
