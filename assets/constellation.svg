<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Animated constellation">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0420"/>
      <stop offset="50%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C77DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#cbg)"/>

  <!-- Background dust -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="40"  r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s"  begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="120" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="60"  r="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="200" r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="100" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="170" r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="50"  r="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="220" r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="90"  r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.0s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="190" r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="240" r="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="40"  r="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Main bright stars (constellation points) -->
  <g filter="url(#cglow)">
    <g transform="translate(100,140)">
      <circle r="14" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#fff"/>
    </g>
    <g transform="translate(280,80)">
      <circle r="12" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.7s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle r="2.5" fill="#fff"/>
    </g>
    <g transform="translate(450,180)">
      <circle r="13" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="2.8" fill="#fff"/>
    </g>
    <g transform="translate(600,90)">
      <circle r="14" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#fff"/>
    </g>
    <g transform="translate(760,200)">
      <circle r="13" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle r="2.8" fill="#fff"/>
    </g>
    <g transform="translate(920,120)">
      <circle r="12" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle r="2.6" fill="#fff"/>
    </g>
    <g transform="translate(1100,160)">
      <circle r="14" fill="url(#starGlow)" opacity="0.6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#fff"/>
    </g>
  </g>

  <!-- Constellation lines drawing themselves -->
  <g stroke="url(#line)" stroke-width="1.4" fill="none">
    <line x1="100" y1="140" x2="280" y2="80" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;0;0;200" dur="10s" keyTimes="0;0.25;0.85;1" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="80" x2="450" y2="180" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" dur="10s" keyTimes="0;0.15;0.35;0.85;1" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="180" x2="600" y2="90" stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" values="180;180;0;0;180" dur="10s" keyTimes="0;0.25;0.45;0.85;1" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="90" x2="760" y2="200" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" dur="10s" keyTimes="0;0.35;0.55;0.85;1" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="200" x2="920" y2="120" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" dur="10s" keyTimes="0;0.45;0.65;0.85;1" repeatCount="indefinite"/>
    </line>
    <line x1="920" y1="120" x2="1100" y2="160" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" dur="10s" keyTimes="0;0.55;0.75;0.85;1" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Shooting star -->
  <g>
    <line x1="-50" y1="50" x2="0" y2="80" stroke="#fff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="7s" keyTimes="0;0.85;0.88;0.96;1" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;1300 200" dur="7s" keyTimes="0;0.85;1" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
